name: Consola

on:
  push:
    paths:
      - "console/**"
      - ".github/workflows/console.yml"
  pull_request:
    paths:
      - "console/**"
      - ".github/workflows/console.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zia_console
          POSTGRES_PASSWORD: zia_console
          POSTGRES_DB: zia_console_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zia_console -d zia_console_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          DATABASE_URL: postgres://zia_console:zia_console@127.0.0.1:5432/zia_console_test
