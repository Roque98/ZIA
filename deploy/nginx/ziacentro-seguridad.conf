# /etc/nginx/snippets/ziacentro-seguridad.conf — cabeceras de seguridad de https://ziacentro.mx
# Se incluye en el server 443 de ziacentro.mx Y en cada location que tenga su propio add_header
# (nginx no hereda add_header del server si la location define alguno).
# Revertir: quitar los include de sites-available/ziacentro-mx, nginx -t, systemctl reload nginx.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
# CSP en modo solo-reporte (no bloquea nada; las violaciones aparecen en la consola del navegador).
# - script: propios + /cdn-cgi de Cloudflare (mismo origen) + el onload="this.media='all'" de los CSS diferidos (hash)
# - style 'unsafe-inline': la página usa atributos style="--c: ..." y GSAP escribe estilos en línea
# - img data:: flechas SVG en CSS; connect 'self': /api/chat; wa.me y tel: son navegación, no requieren CSP
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-hashes' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; manifest-src 'self'" always;
