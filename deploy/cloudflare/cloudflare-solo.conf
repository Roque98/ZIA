# /etc/nginx/snippets/cloudflare-solo.conf — solo acepta conexiones desde Cloudflare (o locales).
# $desde_cloudflare lo define /etc/nginx/conf.d/cloudflare-geo.conf (generado por cf-actualizar-ips)
# a partir de $realip_remote_addr (la IP TCP real). Peticiones directas al origen: 403.
if ($desde_cloudflare = 0) { return 403; }
