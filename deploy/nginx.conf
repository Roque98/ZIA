# Sitio nginx de ZIA. Copiar a /etc/nginx/sites-available/zia y enlazar en
# sites-enabled (lo hace setup-servidor.sh). Convive con los otros sitios del VPS
# (igas-console, abt-template): nginx elige el sitio por server_name y este archivo
# no toca los demas.
#
# Es un sitio 100 % estatico: no hay proxy, puerto interno, servicio ni base de datos.
#
# Por que aqui NO hay 'listen 443' ni ssl_certificate: el certificado todavia no
# existe y nginx no arranca si apunta a un fichero que no esta. Certbot AÑADE esas
# lineas a este mismo bloque cuando lo emite (ver README.md, paso 4).

server {
    listen 80;
    listen [::]:80;
    # Dominio propio ziacentro.mx (DNS en Cloudflare, nube gris). www.ziacentro.mx y el
    # anterior app.ziacentro.com redirigen 301 aqui (ver sitios ziacentro-mx y zia del VPS).
    server_name ziacentro.mx;

    # Lo que publica el workflow: el contenido de wireframes/bexon/ (sin _archivo).
    root  /srv/zia/web;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # La pagina NUNCA se cachea: es la que apunta a los assets con su ?v= nuevo.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # CSS y JS: los propios se cargan con ?v=AAAAMMDDx (la URL cambia en cada
    # publicacion), asi que cachearlos un mes es seguro; los del template no cambian.
    location ~* \.(?:css|js)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~* \.(?:woff2?|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Imagenes y video conservan su nombre al cambiar: cache corta.
    location ~* \.(?:png|jpe?g|svg|webp|ico|mp4|webm)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Nada que empiece por punto (.git, .env) se sirve, salvo el reto de certbot.
    location ~ /\.(?!well-known) {
        deny all;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
